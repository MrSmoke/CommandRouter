name: Release

on:
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # OIDC token for NuGet trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory ./test-results/

      - name: Package
        run: dotnet pack --no-build --configuration Release --output ./build-output/

      - name: Upload nuget package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Nuget Packages
          path: ./build-output/

      # Requested just before pushing because the key only lasts an hour
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push "./build-output/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
